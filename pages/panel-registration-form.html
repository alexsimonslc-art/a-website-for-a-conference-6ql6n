<!-- ===== PANEL DISCUSSION REGISTRATION FORM (converted from PanelRegistrationForm-10.tsx) ===== -->
<main>
  <section id="panel-reg-hero" class="py-16 bg-black text-center">
    <div class="max-w-xl mx-auto px-4">
      <h1 class="text-3xl font-bold text-white mb-2">Panel Discussion Registration</h1>
      <p class="text-gray-400 mb-8">Join industry experts for insights on business strategy</p>

      <form id="panel-form" class="text-left space-y-5">

        <div class="form-row">
          <div class="form-group">
            <label for="salutation">Salutation *</label>
            <select id="salutation" name="salutation" required>
              <option value="">Select</option>
              <option value="Mr.">Mr.</option>
              <option value="Ms.">Ms.</option>
              <option value="Mrs.">Mrs.</option>
              <option value="Dr.">Dr.</option>
              <option value="Prof.">Prof.</option>
            </select>
          </div>
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="gender">Gender *</label>
            <select id="gender" name="gender" required>
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Others">Others</option>
            </select>
          </div>
          <div class="form-group">
            <label for="age">Age *</label>
            <input type="number" id="age" name="age" min="1" required />
          </div>
        </div>

        <div class="form-group">
          <label for="institution">Institution / Organization Name *</label>
          <input type="text" id="institution" name="institution" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="profession">Profession *</label>
            <select id="profession" name="profession" required>
              <option value="">Select profession</option>
              <option value="Student">Student</option>
              <option value="Professor">Professor</option>
              <option value="Entrepreneur">Entrepreneur</option>
              <option value="Salaried Employee">Salaried Employee</option>
              <option value="Business Professional">Business Professional</option>
              <option value="Corporate Executive">Corporate Executive</option>
              <option value="Consultant">Consultant</option>
              <option value="Researcher">Researcher</option>
              <option value="Others">Others</option>
            </select>
          </div>
          <div class="form-group">
            <label for="qualification">Qualification *</label>
            <select id="qualification" name="qualification" required>
              <option value="">Select qualification</option>
              <option value="UG">UG (Undergraduate)</option>
              <option value="PG">PG (Postgraduate)</option>
              <option value="PhD">PhD</option>
              <option value="Others">Others</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="phone" required />
          </div>
        </div>

        <p id="form-error" class="text-red-400 text-sm hidden"></p>

        <button type="submit" id="submit-btn" class="submit-btn">Register</button>
      </form>
    </div>
  </section>
</main>
